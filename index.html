<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

<!-- Android Icons -->
<link rel="icon" type="image/png" sizes="192x192" href="images/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="images/android-chrome-512x512.png">
  <title>#JustInLoveWithRose</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 30%, #1a0a2e 60%, #0d0520 100%);
      color: #f0e6ff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PROFILE PIC */
.profile-pic{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--primary-pink);
  box-shadow:0 0 20px rgba(255,107,157,0.5);
  flex-shrink:0;
}
/* Mobile */
@media(max-width:768px){

  .chat-message{
    gap:12px;
  }

  .profile-pic{
    width:55px;
    height:55px;
  }

  .message-bubble{
    padding:18px;
    font-size:0.95rem;
  }

}

.chat-message.me .profile-pic{
  order:2;
  border:3px solid #fff;
}

/* PROFILE PIC */
.profile-pic{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--primary-pink);
  box-shadow:0 0 20px rgba(255,107,157,0.5);
  flex-shrink:0;
}

    /* ===== FLOATING HEARTS ===== */
    .floating-hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      animation: floatUp linear infinite;
      opacity: 0.25;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.25; }
      50% { opacity: 0.5; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* ===== HEADER ===== */
    header {
      background: rgba(30, 15, 60, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 105, 180, 0.2);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.3rem;
      background: linear-gradient(135deg, #ff69b4, #ff1493, #ff69b4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      cursor: pointer;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: #ff69b4;
      cursor: pointer;
      width: 32px; height: 32px;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      color: #d4a8ff;
      text-decoration: none;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 20px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    nav a:hover, nav a.active-nav {
      background: rgba(255, 105, 180, 0.15);
      color: #ff69b4;
    }

    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      nav {
        display: none;
        position: absolute;
        top: 100%; left: 0; right: 0;
        background: rgba(30, 15, 60, 0.95);
        backdrop-filter: blur(12px);
        padding: 16px;
        flex-direction: column;
        border-bottom: 1px solid rgba(255, 105, 180, 0.2);
      }
      nav.active { display: flex; }
    }

    /* ===== PAGE CONTENT ===== */
    .page-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 100px;
      position: relative;
      z-index: 1;
    }

    /* ===== GENERIC PAGE STYLES ===== */
    .page-hero {
      text-align: center;
      padding: 48px 20px;
    }

    .page-hero h2 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-hero p {
      color: #d4a8ff;
      font-size: 1rem;
      opacity: 0.85;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .page-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 105, 180, 0.15);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 20px;
      transition: all 0.3s;
    }

    .page-card:hover {
      border-color: rgba(255, 105, 180, 0.3);
      box-shadow: 0 4px 20px rgba(255, 105, 180, 0.1);
    }

    .page-card h3 {
      color: #ff69b4;
      font-size: 1.2rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-card p {
      color: #d4a8ff;
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

  
    .gallery-placeholder {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      transition: transform 0.3s;
    }

    .gallery-placeholder:hover {
      transform: scale(1.05);
    }

    .message-bubble {
      background: rgba(255, 105, 180, 0.08);
      border: 1px solid rgba(255, 105, 180, 0.15);
      border-radius: 20px 20px 20px 4px;
      padding: 16px 20px;
      margin-bottom: 16px;
      max-width: 80%;
      position: relative;
    }

    .message-bubble.right {
      margin-left: auto;
      border-radius: 20px 20px 4px 20px;
      background: rgba(147, 51, 234, 0.1);
      border-color: rgba(147, 51, 234, 0.2);
    }

    .message-bubble .sender {
      font-size: 0.75rem;
      color: #ff69b4;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .message-bubble p {
      color: #d4a8ff;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .surprise-box {
      text-align: center;
      padding: 60px 20px;
    }

    .surprise-emoji {
      font-size: 6rem;
      animation: bounce 2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .surprise-box h2 {
      font-size: 2rem;
      margin: 20px 0 12px;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .surprise-box p {
      color: #d4a8ff;
      font-size: 1.05rem;
      line-height: 1.8;
      max-width: 500px;
      margin: 0 auto;
    }

    /* ===== MUSIC SECTION ===== */
    .music-section h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .music-subtitle {
      text-align: center;
      color: #d4a8ff;
      font-size: 0.95rem;
      margin-bottom: 32px;
      opacity: 0.8;
    }

    /* ===== NOW PLAYING ===== */
    .now-playing {
      background: linear-gradient(135deg, rgba(255, 105, 180, 0.12), rgba(147, 51, 234, 0.12));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 105, 180, 0.25);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .now-playing::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255, 105, 180, 0.05) 0%, transparent 70%);
      animation: rotateGlow 8s linear infinite;
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .now-playing-content {
      position: relative;
      z-index: 1;
    }

    .now-playing-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 105, 180, 0.15);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #ff69b4;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }

    .pulse-dot {
      width: 8px; height: 8px;
      background: #ff1493;
      border-radius: 50%;
      animation: pulseDot 1.5s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .now-playing-disc {
      width: 120px; height: 120px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #1a0a2e, #2d1b4e, #ff69b4, #9333ea, #1a0a2e);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
    }

    .now-playing-disc.spinning {
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .disc-center {
      width: 40px; height: 40px;
      background: radial-gradient(circle, #2d1b4e 40%, #1a0a2e 100%);
      border-radius: 50%;
      border: 2px solid rgba(255, 105, 180, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .disc-ring {
      position: absolute;
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 1px solid rgba(255, 105, 180, 0.15);
    }

    .now-playing-title {
      font-size: 1.4rem;
      color: #fff;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .now-playing-artist {
      color: #d4a8ff;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    /* Audio Visualizer */
    .visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      height: 32px;
      margin-bottom: 20px;
    }

    .visualizer-bar {
      width: 4px;
      background: linear-gradient(to top, #ff69b4, #9333ea);
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .visualizer.active .visualizer-bar {
      animation: visualize 0.8s ease-in-out infinite alternate;
    }

    .visualizer-bar:nth-child(1) { animation-delay: 0s; }
    .visualizer-bar:nth-child(2) { animation-delay: 0.1s; }
    .visualizer-bar:nth-child(3) { animation-delay: 0.2s; }
    .visualizer-bar:nth-child(4) { animation-delay: 0.05s; }
    .visualizer-bar:nth-child(5) { animation-delay: 0.15s; }
    .visualizer-bar:nth-child(6) { animation-delay: 0.25s; }
    .visualizer-bar:nth-child(7) { animation-delay: 0.08s; }
    .visualizer-bar:nth-child(8) { animation-delay: 0.18s; }
    .visualizer-bar:nth-child(9) { animation-delay: 0.12s; }
    .visualizer-bar:nth-child(10) { animation-delay: 0.22s; }
    .visualizer-bar:nth-child(11) { animation-delay: 0.03s; }
    .visualizer-bar:nth-child(12) { animation-delay: 0.13s; }
    .visualizer-bar:nth-child(13) { animation-delay: 0.07s; }
    .visualizer-bar:nth-child(14) { animation-delay: 0.17s; }
    .visualizer-bar:nth-child(15) { animation-delay: 0.09s; }
    .visualizer-bar:nth-child(16) { animation-delay: 0.19s; }

    @keyframes visualize {
      0% { height: 4px; }
      100% { height: 32px; }
    }

    /* Custom Audio Controls */
    .audio-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #d4a8ff;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      color: #ff69b4;
      transform: scale(1.1);
    }

    .ctrl-btn.play-btn {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      border-radius: 50%;
      color: white;
      box-shadow: 0 4px 20px rgba(255, 105, 180, 0.4);
    }

    .ctrl-btn.play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 28px rgba(255, 105, 180, 0.6);
      color: white;
    }

    /* Progress Bar */
    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
    }

    .progress-time {
      font-size: 0.75rem;
      color: #d4a8ff;
      min-width: 36px;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-wrapper {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff69b4, #ff1493);
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s linear;
    }

    audio { display: none; }

    /* ===== SONG LIST ===== */
    .song-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .song-list-title {
      font-size: 1.1rem;
      color: #ff69b4;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .song-count {
      font-size: 0.8rem;
      color: #d4a8ff;
      opacity: 0.7;
    }

    .song-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-item {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 105, 180, 0.1);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .song-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(255, 105, 180, 0.08), rgba(147, 51, 234, 0.08));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .song-item:hover::before,
    .song-item.active::before {
      opacity: 1;
    }

    .song-item:hover {
      transform: translateX(4px);
      border-color: rgba(255, 105, 180, 0.3);
      box-shadow: 0 4px 20px rgba(255, 105, 180, 0.1);
    }

    .song-item.active {
      border-color: rgba(255, 105, 180, 0.4);
      box-shadow: 0 4px 24px rgba(255, 105, 180, 0.15);
    }

    .song-number {
      font-size: 0.85rem;
      color: #d4a8ff;
      opacity: 0.5;
      min-width: 20px;
      text-align: center;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    .song-item.active .song-number,
    .song-item:hover .song-number {
      opacity: 0;
    }

    .song-play-indicator {
      position: absolute;
      left: 18px;
      opacity: 0;
      z-index: 2;
      color: #ff69b4;
      transition: opacity 0.3s;
    }

    .song-item:hover .song-play-indicator {
      opacity: 1;
    }

    .song-item.active .song-play-indicator {
      opacity: 1;
    }

    .mini-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .mini-bar {
      width: 3px;
      background: #ff69b4;
      border-radius: 1px;
      animation: miniVisualize 0.6s ease-in-out infinite alternate;
    }

    .mini-bar:nth-child(1) { animation-delay: 0s; height: 6px; }
    .mini-bar:nth-child(2) { animation-delay: 0.15s; height: 10px; }
    .mini-bar:nth-child(3) { animation-delay: 0.3s; height: 8px; }

    @keyframes miniVisualize {
      0% { height: 4px; }
      100% { height: 14px; }
    }

    .song-thumb {
      width: 48px; height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .song-thumb-1 { background: linear-gradient(135deg, #ff69b4, #ff1493); }
    .song-thumb-2 { background: linear-gradient(135deg, #9333ea, #7c3aed); }
    .song-thumb-3 { background: linear-gradient(135deg, #ec4899, #db2777); }
    .song-thumb-4 { background: linear-gradient(135deg, #a855f7, #9333ea); }
    .song-thumb-5 { background: linear-gradient(135deg, #f472b6, #ec4899); }
    .song-thumb-6 { background: linear-gradient(135deg, #c084fc, #a855f7); }
    .song-thumb-7 { background: linear-gradient(135deg, #fb7185, #f43f5e); }
    .song-thumb-8 { background: linear-gradient(135deg, #818cf8, #6366f1); }

    .song-details {
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .song-details h3 {
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-item.active .song-details h3 {
      color: #ff69b4;
    }

    .song-details p {
      font-size: 0.8rem;
      color: #d4a8ff;
      opacity: 0.7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-dedication {
      font-size: 0.75rem;
      color: #ff69b4;
      opacity: 0;
      margin-top: 4px;
      font-style: italic;
      transition: opacity 0.3s;
    }

    .song-item:hover .song-dedication,
    .song-item.active .song-dedication {
      opacity: 0.8;
    }

    .song-duration {
      font-size: 0.8rem;
      color: #d4a8ff;
      opacity: 0.5;
      position: relative;
      z-index: 1;
    }

    .song-heart {
      color: #ff1493;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s;
      position: relative;
      z-index: 1;
      cursor: pointer;
    }

    .song-item:hover .song-heart {
      opacity: 0.6;
    }

    .song-heart.liked {
      opacity: 1 !important;
      animation: heartPop 0.4s ease;
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    /* ===== SPOTIFY EMBED SECTION ===== */
    .spotify-section {
      margin-top: 40px;
    }

    .spotify-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .spotify-icon {
      width: 24px; height: 24px;
      color: #1DB954;
    }

    .spotify-header h3 {
      font-size: 1.1rem;
      color: #ff69b4;
      font-weight: 600;
    }

    .spotify-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .spotify-embed {
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 105, 180, 0.1);
      transition: all 0.3s;
    }

    .spotify-embed:hover {
      border-color: rgba(255, 105, 180, 0.3);
      box-shadow: 0 4px 20px rgba(255, 105, 180, 0.1);
    }

    .spotify-embed iframe {
      display: block;
      width: 100%;
      border: none;
    }

    /* ===== PERSISTENT MINI PLAYER ===== */
    .mini-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20, 10, 40, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 105, 180, 0.25);
      padding: 10px 20px;
      display: none;
      align-items: center;
      gap: 14px;
      z-index: 200;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
    }

    .mini-player.visible {
      display: flex;
    }

    .mini-player-disc {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #1a0a2e, #2d1b4e, #ff69b4, #9333ea, #1a0a2e);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;

// ===== TIMELINE PAGE INITIALIZATION =====
// Call this function after inserting getTimelinePage() HTML into the DOM
function initTimelinePage() {
  var MONTHSARY_DAY = 23;
  var ANNIVERSARY_START = new Date("February 23, 2025 00:00:00");

  function formatDate(date) {
    var months = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    return months[date.getMonth()] + " " + date.getDate() + ", " + date.getFullYear();
  }

  function padZero(num) {
    return num < 10 ? "0" + num : num;
  }

  function getOrdinal(n) {
    var s = ["th", "st", "nd", "rd"];
    var v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function getMonthNumber(targetDate) {
    var startYear = ANNIVERSARY_START.getFullYear();
    var startMonth = ANNIVERSARY_START.getMonth();
    var targetYear = targetDate.getFullYear();
    var targetMonth = targetDate.getMonth();
    return (targetYear - startYear) * 12 + (targetMonth - startMonth);
  }

  function isMonthsaryToday() {
    var now = new Date();
    return now.getDate() === MONTHSARY_DAY;
  }

  function getCurrentMonthsaryNumber() {
    var now = new Date();
    var startYear = ANNIVERSARY_START.getFullYear();
    var startMonth = ANNIVERSARY_START.getMonth();
    return (now.getFullYear() - startYear) * 12 + (now.getMonth() - startMonth);
  }

  function isAnniversaryToday() {
    var now = new Date();
    return now.getMonth() === ANNIVERSARY_START.getMonth() &&
           now.getDate() === ANNIVERSARY_START.getDate() &&
           now.getFullYear() > ANNIVERSARY_START.getFullYear();
  }

  function getAnniversaryYear() {
    var now = new Date();
    return now.getFullYear() - ANNIVERSARY_START.getFullYear();
  }

  function getNextMonthsary() {
    var now = new Date();
    var currentYear = now.getFullYear();
    var currentMonth = now.getMonth();
    var currentDay = now.getDate();
    var targetMonth, targetYear;

    if (currentDay < MONTHSARY_DAY) {
      targetMonth = currentMonth;
      targetYear = currentYear;
    } else {
      targetMonth = currentMonth + 1;
      targetYear = currentYear;
    }

    if (targetMonth > 11) {
      targetMonth = targetMonth - 12;
      targetYear = targetYear + 1;
    }

    return new Date(targetYear, targetMonth, MONTHSARY_DAY, 0, 0, 0);
  }

  function showGreetingModal() {
    var modal = document.getElementById('monthsary-modal');
    var modalIcon = document.getElementById('modal-icon');
    var modalTitle = document.getElementById('modal-title');
    var monthLabel = document.getElementById('modal-month-label');
    var dateLabel = document.getElementById('modal-date-label');
    var modalMessage = document.getElementById('modal-message');
    var closeBtn = document.getElementById('modal-close-btn');
    var closeX = document.getElementById('modal-close-x');
    var backdrop = document.getElementById('modal-backdrop');

    if (isAnniversaryToday()) {
      var yearNum = getAnniversaryYear();
      var ordinalYear = getOrdinal(yearNum);
      modalIcon.textContent = '💍';
      modalTitle.textContent = 'Happy ' + ordinalYear + ' Anniversary!';
      monthLabel.textContent = ordinalYear + ' Year Together 🎉';
      modalMessage.innerHTML =
        '#JustInLoveWithRose🤍 💖<br>' +
        ordinalYear + ' year of love, laughter, and forever! 🥂<br>' +
        'Mahal kita, today and always! 🌹✨';
    } else {
      var monthNum = getCurrentMonthsaryNumber();
      var ordinalMonth = getOrdinal(monthNum);
      modalIcon.textContent = '💕';
      modalTitle.textContent = 'Happy ' + ordinalMonth + ' Monthsary!';
      monthLabel.textContent = ordinalMonth + ' Month Together 💍';
      modalMessage.innerHTML =
        '#JustInLoveWithRose🤍<br>' +
        'Another beautiful month of loving you.<br>' +
        "Here's to forever and always! 🌹✨";
    }

    if (dateLabel) {
      dateLabel.textContent = formatDate(new Date());
    }

    modal.classList.add('active');
    document.body.style.overflow = 'hidden';

    function closeModal() {
      modal.classList.remove('active');
      modal.classList.add('closing');
      document.body.style.overflow = '';
      setTimeout(function() {
        modal.classList.remove('closing');
      }, 500);
    }

    closeBtn.addEventListener('click', closeModal);
    closeX.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);
  }

  function updateCountdown() {
    var now = new Date();
    var headerText = document.getElementById('countdown-header-text');

    if (isMonthsaryToday()) {
      var monthNum = getCurrentMonthsaryNumber();
      var ordinalMonth = getOrdinal(monthNum);

      document.getElementById("days").innerHTML = "🎉";
      document.getElementById("hours").innerHTML = "💖";
      document.getElementById("minutes").innerHTML = "🌹";
      document.getElementById("seconds").innerHTML = "✨";

      if (headerText) {
        if (isAnniversaryToday()) {
          var yearNum = getAnniversaryYear();
          var ordinalYear = getOrdinal(yearNum);
          headerText.textContent = "🎉 Happy " + ordinalYear + " Anniversary! 🎉";
        } else {
          headerText.textContent = "🎉 Happy " + ordinalMonth + " Monthsary! 🎉";
        }
      }

      var label = document.getElementById("monthsary-label");
      if (label) {
        if (isAnniversaryToday()) {
          var yearNum2 = getAnniversaryYear();
          var ordinalYear2 = getOrdinal(yearNum2);
          label.innerHTML = "Happy " + ordinalYear2 + " Anniversary, #JustInLoveWithRose🤍! 💍🎉<br>Since February 23, 2025 💖";
        } else {
          label.innerHTML = "Happy " + ordinalMonth + " Monthsary, #JustInLoveWithRose🤍! 💖<br>Since February 23, 2025 💖";
        }
      }
      return;
    }

    var nextMonthsary = getNextMonthsary();
    var distance = nextMonthsary.getTime() - now.getTime();

    var days = Math.floor(distance / (1000 * 60 * 60 * 24));
    var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").innerHTML = padZero(days);
    document.getElementById("hours").innerHTML = padZero(hours);
    document.getElementById("minutes").innerHTML = padZero(minutes);
    document.getElementById("seconds").innerHTML = padZero(seconds);

    if (headerText) {
      headerText.textContent = "Next Monthsary Countdown 💕";
    }

    var nextMonthNum = getMonthNumber(nextMonthsary);
    var ordinalNext = getOrdinal(nextMonthNum);
    var label2 = document.getElementById("monthsary-label");
    if (label2) {
      label2.innerHTML = "Next: " + formatDate(nextMonthsary) + " (" + ordinalNext + " Month) <br>Since February 23, 2025 ";
    }
  }

  // Initialize Lucide icons for the timeline page
  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
  }

  // Start countdown
  updateCountdown();
  var countdownInterval = setInterval(updateCountdown, 1000);

  // Show greeting modal if it's monthsary day (the 23rd)
  if (isMonthsaryToday()) {
    setTimeout(showGreetingModal, 800);
  }

  // Return cleanup function to clear interval when navigating away
  return function cleanup() {
    clearInterval(countdownInterval);
  };
}

function createFloatingHearts() {
    const container = document.getElementById('floatingHearts');
    if (!container) return;

    const hearts = ['❤️', '💕', '💖', '💗', '💝', '💘', '🌹', '✨', '💜', '💛'];

    function spawnHeart() {
        const heart = document.createElement('span');
        heart.classList.add('heart');
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (Math.random() * 16 + 12) + 'px';
        heart.style.animationDuration = (Math.random() * 6 + 6) + 's';
        heart.style.animationDelay = Math.random() * 2 + 's';
        container.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 14000);
    }

    // Spawn initial hearts
    for (let i = 0; i < 8; i++) {
        setTimeout(spawnHeart, i * 500);
    }

    // Continue spawning
    setInterval(spawnHeart, 2000);
}

      if (i === 4) { heartClass = ' liked'; heartText = '♥'; }

      var indicatorHTML;
      if (i === currentSongIndex && isPlaying) {
        indicatorHTML = '<div class="mini-bars"><div class="mini-bar"></div><div class="mini-bar"></div><div class="mini-bar"></div></div>';
      } else {
        indicatorHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>';
      }

      songListHTML += '<li class="song-item' + isActive + '" data-index="' + i + '" onclick="handleSongClick(event, ' + i + ')">' +
        '<span class="song-number">' + (i + 1) + '</span>' +
        '<div class="song-play-indicator">' + indicatorHTML + '</div>' +
        '<div class="song-thumb song-thumb-' + (i + 1) + '">' + s.emoji + '</div>' +
        '<div class="song-details">' +
          '<h3>' + s.title + '</h3>' +
          '<p>' + s.artist + '</p>' +
          '<div class="song-dedication">💭 "' + s.dedication + '"</div>' +
        '</div>' +
        '<span class="song-duration">' + s.duration + '</span>' +
        '<span class="song-heart' + heartClass + '" title="Like" onclick="handleHeartClick(event, this)">' + heartText + '</span>' +
      '</li>';
    }

    var npStatusText = currentSongIndex >= 0 ? (isPlaying ? 'Now Playing' : 'Paused') : 'Select a song';
    var npTitleText = currentSongIndex >= 0 ? songs[currentSongIndex].title : 'Our Playlist';
    var npArtistText = currentSongIndex >= 0 ? songs[currentSongIndex].artist + ' 💖' : 'Justin & Rose 💖';
    var discClass = isPlaying ? ' spinning' : '';
    var visClass = isPlaying ? ' active' : '';

    return '<div class="page-view">' +
      '<section class="music-section">' +
        '<h2>Our Songs 🎵</h2>' +
        '<p class="music-subtitle">The soundtrack of our love story — every song tells a piece of us 💕</p>' +

        '<div class="now-playing">' +
          '<div class="now-playing-content">' +
            '<div class="now-playing-label">' +
              '<div class="pulse-dot" id="pulse-dot"></div>' +
              '<span id="np-status">' + npStatusText + '</span>' +
            '</div>' +
            '<div class="now-playing-disc' + discClass + '" id="disc">' +
              '<div class="disc-ring"></div>' +
              '<div class="disc-center">🎵</div>' +
            '</div>' +
            '<div class="now-playing-title" id="np-title">' + npTitleText + '</div>' +
            '<div class="now-playing-artist" id="np-artist">' + npArtistText + '</div>' +
            '<div class="visualizer' + visClass + '" id="visualizer">' +
              '<div class="visualizer-bar" style="height:4px"></div>' +
              '<div class="visualizer-bar" style="height:8px"></div>' +
              '<div class="visualizer-bar" style="height:12px"></div>' +
              '<div class="visualizer-bar" style="height:6px"></div>' +
              '<div class="visualizer-bar" style="height:16px"></div>' +
              '<div class="visualizer-bar" style="height:10px"></div>' +
              '<div class="visualizer-bar" style="height:20px"></div>' +
              '<div class="visualizer-bar" style="height:14px"></div>' +
              '<div class="visualizer-bar" style="height:8px"></div>' +
              '<div class="visualizer-bar" style="height:18px"></div>' +
              '<div class="visualizer-bar" style="height:6px"></div>' +
              '<div class="visualizer-bar" style="height:12px"></div>' +
              '<div class="visualizer-bar" style="height:22px"></div>' +
              '<div class="visualizer-bar" style="height:10px"></div>' +
              '<div class="visualizer-bar" style="height:16px"></div>' +
              '<div class="visualizer-bar" style="height:8px"></div>' +
            '</div>' +
            '<div class="audio-controls">' +
              '<button class="ctrl-btn" onclick="prevSong()" title="Previous"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>' +
              '<button class="ctrl-btn play-btn" onclick="togglePlay()" title="Play" id="page-play-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="page-play-icon">' + (isPlaying ? '<rect x="7" y="5" width="3" height="14"/><rect x="14" y="5" width="3" height="14"/>' : '<polygon points="8,5 19,12 8,19"/>') + '</svg></button>' +
              '<button class="ctrl-btn" onclick="nextSong()" title="Next"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>' +
            '</div>' +
            '<div class="progress-container">' +
              '<span class="progress-time" id="page-current-time">0:00</span>' +
              '<div class="progress-bar-wrapper" id="page-progress-wrapper" onclick="seekFromPage(event)">' +
                '<div class="progress-bar-fill" id="page-progress-fill"></div>' +
              '</div>' +
              '<span class="progress-time" id="page-total-time">0:00</span>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="song-list-header">' +
          '<div class="song-list-title">🎶 Playlist</div>' +
          '<div class="song-count">' + songs.length + ' songs</div>' +
        '</div>' +
        '<ul class="song-list" id="song-list">' + songListHTML + '</ul>' +

        // '<div class="spotify-section">' +
        //   '<div class="spotify-header">' +
        //     '<svg class="spotify-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>' +
        //     '<h3>Listen on Spotify 🎧</h3>' +
        //   '</div>' +
        //   '<div class="spotify-grid">' +
        //     '<div class="spotify-embed"><iframe src="https://open.spotify.com/embed/track/3wrMEMBDqMSfGOKghHPJWP?utm_source=generator&theme=0" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>' +
        //     '<div class="spotify-embed"><iframe src="https://open.spotify.com/embed/track/5FjDBJRomEBF7VBLbatMR7?utm_source=generator&theme=0" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>' +
        //     '<div class="spotify-embed"><iframe src="https://open.spotify.com/embed/track/0K6vSBqVMJfVjFOaxOPPJV?utm_source=generator&theme=0" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>' +
        //     '<div class="spotify-embed"><iframe src="https://open.spotify.com/embed/track/4PdLaGZubp4lghChqp8erB?utm_source=generator&theme=0" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>' +
        //   '</div>' +
        // '</div>' +
      '</section>' +
    '</div>';
  }

  function getSurprisePage() {
    return '<div class="page-view">' +
      '<div class="surprise-box">' +
        '<div class="surprise-emoji">🎁</div>' +
        '<h2>A Special Surprise For You</h2>' +
        '<p>Rose, every day with you feels like unwrapping a gift. You are the most beautiful surprise life has ever given me. I promise to love you, cherish you, and make you smile every single day. You are my forever. 💖</p>' +
      '</div>' +
      '<div class="page-grid">' +
        '<div class="page-card" style="text-align:center">' +
          '<h3>🌟 Reason #1</h3>' +
          '<p>Your smile makes my entire world brighter. Even on the darkest days, one look at you and everything feels okay.</p>' +
        '</div>' +
        '<div class="page-card" style="text-align:center">' +
          '<h3>💫 Reason #2</h3>' +
          '<p>The way you laugh — it\'s the most beautiful sound in the universe. I\'d do anything to hear it every day.</p>' +
        '</div>' +
        '<div class="page-card" style="text-align:center">' +
          '<h3>❤️ Reason #3</h3>' +
          '<p>You love me for who I am, flaws and all. With you, I feel safe, understood, and truly loved.</p>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ===== ROUTING =====
  var currentPage = 'home';

  function navigateTo(page) {
    currentPage = page;
    window.location.hash = page;
    renderPage();
    // Close mobile menu
    var nav = document.getElementById('main-nav');
    if (nav) nav.classList.remove('active');
    // Scroll to top
    window.scrollTo(0, 0);
  }

  var timelineCleanup = null; // Add this at the top with your global variables

function renderPage() {
    var content = document.getElementById('page-content');
    var pageMap = {
      'home': getHomePage,
      'about': getAboutPage,
      'gallery': getGalleryPage,
      'timeline': getTimelinePage,
      'messages': getMessagesPage,
      'music': getMusicPage,
      'surprise': getSurprisePage
    };

    // Clean up previous timeline interval if navigating away
    if (timelineCleanup) {
      timelineCleanup();
      timelineCleanup = null;
    }

    var pageFn = pageMap[currentPage] || getHomePage;
    content.innerHTML = pageFn();

    // Update nav active state
    var navLinks = document.querySelectorAll('nav a');
    navLinks.forEach(function(link) {
      link.classList.remove('active-nav');
      if (link.getAttribute('data-page') === currentPage) {
        link.classList.add('active-nav');
      }
    });

    // Initialize timeline countdown when on timeline page
    if (currentPage === 'timeline') {
      timelineCleanup = initTimelinePage();
    }

    // If on music page, sync progress display
    if (currentPage === 'music') {
      syncMusicPageUI();
    }
}


  // Handle hash changes (back/forward)
  window.addEventListener('hashchange', function() {
    var hash = window.location.hash.replace('#', '') || 'home';
    currentPage = hash;
    renderPage();
  });

  // ===== MUSIC PLAYER LOGIC =====
  function formatTime(sec) {
    if (isNaN(sec) || sec < 0) return '0:00';
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function selectSong(index) {
    if (index < 0 || index >= songs.length) return;
    currentSongIndex = index;

    // Set audio source and play
    audio.src = songs[index].file;
    audio.load();
    audio.play().then(function() {
      isPlaying = true;
      updateAllUI();
    }).catch(function(e) {
      // Autoplay might be blocked, still update UI
      console.log('Playback requires user interaction:', e);
      isPlaying = true;
      updateAllUI();
    });
  }

  function togglePlay() {
    if (currentSongIndex === -1) {
      selectSong(0);
      return;
    }

    if (isPlaying) {
      audio.pause();
      isPlaying = false;
    } else {
      audio.play().catch(function() {});
      isPlaying = true;
    }
    updateAllUI();
  }

  function prevSong() {
    var newIndex = currentSongIndex <= 0 ? songs.length - 1 : currentSongIndex - 1;
    selectSong(newIndex);
  }

  function nextSong() {
    var newIndex = currentSongIndex >= songs.length - 1 ? 0 : currentSongIndex + 1;
    selectSong(newIndex);
  }

  function handleSongClick(e, index) {
    if (e.target.classList.contains('song-heart')) return;
    selectSong(index);
  }

  function handleHeartClick(e, el) {
    e.stopPropagation();
    if (el.classList.contains('liked')) {
      el.classList.remove('liked');
      el.textContent = '♡';
    } else {
      el.classList.add('liked');
      el.textContent = '♥';
    }
  }

  function seekFromPage(e) {
    var wrapper = document.getElementById('page-progress-wrapper');
    if (!wrapper || isNaN(audio.duration)) return;
    var rect = wrapper.getBoundingClientRect();
    var clickX = e.clientX - rect.left;
    var percent = clickX / rect.width;
    audio.currentTime = percent * audio.duration;
  }

  // ===== UPDATE ALL UI =====
  function updateAllUI() {
    updateMiniPlayer();
    if (currentPage === 'music') {
      syncMusicPageUI();
    }
  }

  function updateMiniPlayer() {
    var miniPlayer = document.getElementById('mini-player');
    var miniTitle = document.getElementById('mini-title');
    var miniArtist = document.getElementById('mini-artist');
    var miniDisc = document.getElementById('mini-disc');
    var miniVis = document.getElementById('mini-visualizer');
    var miniPlayIcon = document.getElementById('mini-play-icon');

    if (currentSongIndex >= 0) {
      miniPlayer.classList.add('visible');
      miniTitle.textContent = songs[currentSongIndex].title;
      miniArtist.textContent = songs[currentSongIndex].artist;

      if (isPlaying) {
        miniDisc.classList.add('spinning');
        miniVis.classList.add('active');
        miniPlayIcon.innerHTML = '<rect x="7" y="5" width="3" height="14"/><rect x="14" y="5" width="3" height="14"/>';
      } else {
        miniDisc.classList.remove('spinning');
        miniVis.classList.remove('active');
        miniPlayIcon.innerHTML = '<polygon points="8,5 19,12 8,19"/>';
      }
    } else {
      miniPlayer.classList.remove('visible');
    }
  }

  function syncMusicPageUI() {
    var disc = document.getElementById('disc');
    var visualizer = document.getElementById('visualizer');
    var npTitle = document.getElementById('np-title');
    var npArtist = document.getElementById('np-artist');
    var npStatus = document.getElementById('np-status');
    var pulseDot = document.getElementById('pulse-dot');
    var pagePlayIcon = document.getElementById('page-play-icon');

    if (!disc) return; // Not on music page

    if (currentSongIndex >= 0) {
      npTitle.textContent = songs[currentSongIndex].title;
      npArtist.textContent = songs[currentSongIndex].artist + ' 💖';

      if (isPlaying) {
        disc.classList.add('spinning');
        visualizer.classList.add('active');
        npStatus.textContent = 'Now Playing';
        if (pulseDot) pulseDot.style.background = '#ff1493';
        if (pagePlayIcon) pagePlayIcon.innerHTML = '<rect x="7" y="5" width="3" height="14"/><rect x="14" y="5" width="3" height="14"/>';
      } else {
        disc.classList.remove('spinning');
        visualizer.classList.remove('active');
        npStatus.textContent = 'Paused';
        if (pulseDot) pulseDot.style.background = '#d4a8ff';
        if (pagePlayIcon) pagePlayIcon.innerHTML = '<polygon points="8,5 19,12 8,19"/>';
      }
    }

    // Update song list active states
    var songItems = document.querySelectorAll('.song-item');
    songItems.forEach(function(item, idx) {
      item.classList.remove('active');
      var indicator = item.querySelector('.song-play-indicator');
      if (idx === currentSongIndex) {
        item.classList.add('active');
        if (indicator && isPlaying) {
          indicator.innerHTML = '<div class="mini-bars"><div class="mini-bar"></div><div class="mini-bar"></div><div class="mini-bar"></div></div>';
        } else if (indicator) {
          indicator.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>';
        }
      } else {
        if (indicator) {
          indicator.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>';
        }
      }
    });
  }

  // ===== AUDIO TIME UPDATE =====
  audio.addEventListener('timeupdate', function() {
    if (isNaN(audio.duration)) return;
    var percent = (audio.currentTime / audio.duration) * 100;

    // Mini player progress
    var miniFill = document.getElementById('mini-progress-fill');
    var miniCurTime = document.getElementById('mini-current-time');
    var miniTotTime = document.getElementById('mini-total-time');
    if (miniFill) miniFill.style.width = percent + '%';
    if (miniCurTime) miniCurTime.textContent = formatTime(audio.currentTime);
    if (miniTotTime) miniTotTime.textContent = formatTime(audio.duration);

    // Music page progress (if visible)
    var pageFill = document.getElementById('page-progress-fill');
    var pageCurTime = document.getElementById('page-current-time');
    var pageTotTime = document.getElementById('page-total-time');
    if (pageFill) pageFill.style.width = percent + '%';
    if (pageCurTime) pageCurTime.textContent = formatTime(audio.currentTime);
    if (pageTotTime) pageTotTime.textContent = formatTime(audio.duration);
  });

  // Auto-next on song end
  audio.addEventListener('ended', function() {
    nextSong();
  });

  // Mini player progress click
  document.getElementById('mini-progress-wrapper').addEventListener('click', function(e) {
    if (isNaN(audio.duration)) return;
    var rect = this.getBoundingClientRect();
    var clickX = e.clientX - rect.left;
    var percent = clickX / rect.width;
    audio.currentTime = percent * audio.duration;
  });

  // Mini player controls
  document.getElementById('mini-play-btn').addEventListener('click', togglePlay);
  document.getElementById('mini-prev-btn').addEventListener('click', prevSong);
  document.getElementById('mini-next-btn').addEventListener('click', nextSong);

  // ===== FLOATING HEARTS =====
  function createFloatingHearts() {
    var container = document.getElementById('floating-hearts');
    var hearts = ['💖', '💕', '💗', '💓', '❤️', '🌹', '✨', '🎵', '🎶'];
    for (var i = 0; i < 12; i++) {
      var heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDuration = (8 + Math.random() * 12) + 's';
      heart.style.animationDelay = (Math.random() * 10) + 's';
      heart.style.fontSize = (14 + Math.random() * 16) + 'px';
      container.appendChild(heart);
    }
  }

  // ===== MOBILE MENU =====
  var menuToggle = document.getElementById('menu-toggle');
  var mainNav = document.getElementById('main-nav');
  if (menuToggle && mainNav) {
    menuToggle.addEventListener('click', function() {
      mainNav.classList.toggle('active');
    });
  }

  // ===== KEYBOARD SHORTCUTS =====
  document.addEventListener('keydown', function(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowRight') {
      nextSong();
    } else if (e.code === 'ArrowLeft') {
      prevSong();
    }
  });

  // ===== INIT =====
  createFloatingHearts();

  // Read initial hash
  var initHash = window.location.hash.replace('#', '') || 'home';
  currentPage = initHash;
  renderPage();
  </script>

if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Autumn',
    artist: 'Ben&Ben',

    artwork: [
      {
        src: 'images/apple-touch-icon.png',
        sizes: '180x180',
        type: 'image/png'
      },
      {
        src: 'images/android-chrome-192x192.png',
        sizes: '192x192',
        type: 'image/png'
      },
      {
        src: 'images/android-chrome-512x512.png',
        sizes: '512x512',
        type: 'image/png'
      }
    ]
  });
}
</script>
